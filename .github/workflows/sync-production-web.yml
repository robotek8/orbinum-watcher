name: Sync production web

on:
  push:
    branches:
      - sync-production-web-20260904
    paths:
      - '.sync-web/**'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync-production-web-20260904
      - name: Assemble exact production web.py
        shell: bash
        run: |
          set -euo pipefail
          for i in 00 01 02 03 04 05 06 07 08 09; do
            test -f ".sync-web/chunk_${i}.b64" || { echo "waiting for chunk ${i}"; exit 0; }
          done
          cat .sync-web/chunk_*.b64 > /tmp/web.b64
          base64 -d /tmp/web.b64 > web.py
          echo '5c119bde252a180b622df5df903852a048178c393284a266bcc8674d73610d3d  web.py' | sha256sum -c -
          python3 -m py_compile web.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web.py
          git rm -r .sync-web
          git rm .github/workflows/sync-production-web.yml
          git commit -m 'sync dashboard with production stress incident UI'
          git push origin HEAD:sync-production-web-20260904
